[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pref-cal"
version = "1.4.0"
description = "Counterfactual calibration for AI preference elicitation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Kishore Kumar Mariappan"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "openai>=1.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prefcal*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

